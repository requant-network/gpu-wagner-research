name: CPU references and artifact integrity
on: [push, pull_request]
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m compileall -q .
      - run: python cpu_study.py --output build/ci.json
      - run: python verify_results.py
      - run: python verify_proofs.py
      - run: python verify_campaigns.py
      - run: python summarize_results.py
      - run: python verify_followups.py
      - run: git diff --exit-code -- results/followup-summary.csv results/*-summary.csv
